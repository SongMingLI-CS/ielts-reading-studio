# Alembic configuration for the single-file SQLite state database.
#
# The database URL is never stored here: `alembic/env.py` resolves it (programmatic
# callers pass a connection, the CLI uses IELTS_DATABASE_URL or config.yaml).
[alembic]
# %(here)s is the directory holding this ini file, so `alembic -c /path/to/alembic.ini`
# works from any working directory.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
version_path_separator = os
# Fail loudly instead of touching a database the application did not point us at.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
