input_dir: input
output_dir: output
database_path: output/state.db
deepseek_base_url: https://api.deepseek.com
author_model: deepseek-flash
examiner_model: deepseek-v4-pro
concurrency: 2
batch_size: 20
author_revision_limit: 2
examiner_revision_limit: 2
min_source_chars: 800
max_merged_chapters: 4
max_merged_chars: 4000
split_source_chars: 6000
split_min_chars: 2500
split_max_chars: 4500
max_units_per_run: 20
max_estimated_tokens_per_run: 500000
max_consecutive_failures: 5
# 题目相似度去重：>=0.72 视为重复题并触发返工；审阅页用 0.5 列出疑似。
question_duplicate_threshold: 0.72
question_report_threshold: 0.5
# 批任务跑完自动抽样审阅的比例（至少 1 篇）。
review_sample_rate: 0.1
review_sample_min: 1
