<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}IELTS Reading Studio{% endblock %}</title>
  <meta name="theme-color" content="#123c35">
  <link rel="stylesheet" href="/static/app.css?v=4">
  <link rel="stylesheet" href="/static/practice-center.css?v=6">
  <link rel="stylesheet" href="/static/studio.css?v=1">
  <link rel="stylesheet" href="/static/corpora.css?v=1">
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="/"><span class="brand-mark" aria-hidden="true">R</span><strong>IELTS Learning Studio</strong></a>
    <nav aria-label="主导航">
      <a href="/"{% if request.url.path == '/' %} aria-current="page"{% endif %}>首页</a>
      <a href="/corpora"{% if request.url.path.startswith('/corpora') and request.url.path != '/corpora/import' %} aria-current="page"{% endif %}>语料</a>
      <a href="/practice"{% if request.url.path.startswith('/practice') %} aria-current="page"{% endif %}>阅读练习</a>
      <a href="/novel"{% if request.url.path.startswith('/novel') %} aria-current="page"{% endif %}>情境小说</a>
      <a href="/corpora/import"{% if request.url.path == '/corpora/import' %} aria-current="page"{% endif %}>导入</a>
      <a href="/exports"{% if request.url.path.startswith('/exports') %} aria-current="page"{% endif %}>导出</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
