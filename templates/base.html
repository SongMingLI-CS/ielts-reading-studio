<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}IELTS Reading Studio{% endblock %}</title>
  <meta name="theme-color" content="#123c35">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <script src="/static/security.js?v=1" defer></script>
  <link rel="stylesheet" href="/static/app.css?v=7">
  <link rel="stylesheet" href="/static/practice-center.css?v=7">
  <link rel="stylesheet" href="/static/studio.css?v=2">
  <link rel="stylesheet" href="/static/corpora.css?v=3">
  <link rel="stylesheet" href="/static/knowledge.css?v=2">
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="/"><span class="brand-mark" aria-hidden="true">R</span><strong>IELTS Learning Studio</strong></a>
    <nav aria-label="主导航">
      <div class="nav-group">
        <span class="nav-label">学习</span>
        <a href="/"{% if request.url.path == '/' %} aria-current="page"{% endif %}>首页</a>
        <a href="/practice"{% if request.url.path.startswith('/practice') %} aria-current="page"{% endif %}><span class="nav-full">阅读练习</span><span class="nav-short">阅读</span></a>
        <a href="/writing"{% if request.url.path.startswith('/writing') %} aria-current="page"{% endif %}><span class="nav-full">写作评估</span><span class="nav-short">写作</span></a>
        <a href="/knowledge"{% if request.url.path.startswith('/knowledge') %} aria-current="page"{% endif %}>知识点</a>
        <a href="/vocabulary"{% if request.url.path.startswith('/vocabulary') %} aria-current="page"{% endif %}>词汇</a>
        <a href="/novel"{% if request.url.path.startswith('/novel') %} aria-current="page"{% endif %}><span class="nav-full">情境小说</span><span class="nav-short">小说</span></a>
      </div>
      <div class="nav-group">
        <span class="nav-label">内容管理</span>
        <a href="/corpora"{% if request.url.path.startswith('/corpora') and request.url.path != '/corpora/import' %} aria-current="page"{% endif %}>语料</a>
        <a href="/corpora/import"{% if request.url.path == '/corpora/import' %} aria-current="page"{% endif %}>导入</a>
        <a href="/jobs"{% if request.url.path.startswith('/jobs') %} aria-current="page"{% endif %}>生成任务</a>
        <a href="/review"{% if request.url.path.startswith('/review') %} aria-current="page"{% endif %}>审阅</a>
        <a href="/exports"{% if request.url.path.startswith('/exports') %} aria-current="page"{% endif %}>导出</a>
      </div>
      <div class="nav-group">
        <span class="nav-label">账户</span>
        <a href="/backup"{% if request.url.path.startswith('/backup') %} aria-current="page"{% endif %}>备份</a>
        <a href="/settings"{% if request.url.path.startswith('/settings') %} aria-current="page"{% endif %}>设置</a>
        <form class="logout-form" action="/logout" method="post">{{ csrf_field() }}<button type="submit">退出</button></form>
      </div>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
