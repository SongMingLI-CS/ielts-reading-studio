{% extends "base.html" %}
{% block title %}任务 {{ job.id }}{% endblock %}
{% block content %}
<p class="eyebrow">任务监控</p><h1>{{ job.id }}</h1><p>状态：<strong id="job-status">{{ job.status }}</strong></p>
<div class="actions"><form action="/jobs/{{ job.id }}/pause" method="post"><button>暂停</button></form><form action="/jobs/{{ job.id }}/resume" method="post"><button>继续</button></form><form action="/jobs/{{ job.id }}/retry" method="post"><button>仅重试失败</button></form><form action="/jobs/{{ job.id }}/cancel" method="post"><button class="danger">取消</button></form></div>
<table><thead><tr><th>序号</th><th>单元</th><th>状态</th></tr></thead><tbody id="unit-rows">{% include "partials/unit_rows.html" %}</tbody></table>
<script>window.JOB_ID={{ job.id|tojson }};window.JOB_STATUS={{ job.status|tojson }};</script>
{% endblock %}
{% block scripts %}<script src="/static/jobs.js"></script>{% endblock %}
