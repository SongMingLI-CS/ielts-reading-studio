name: CI

# Offline gate for every change: both test suites, Ruff, byte-compilation and the CLI
# smoke tests. No provider credentials are configured anywhere in this workflow, and
# the suite stubs every model call, so CI never spends tokens.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # Deliberately empty: the offline gate must pass without a key. Tests stub every
      # provider call, and tests/conftest.py blocks non-loopback connections outright.
      DEEPSEEK_API_KEY: ""
      IELTS_WEB_USERNAME: ""
      IELTS_WEB_PASSWORD: ""
      http_proxy: ""
      https_proxy: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Offline verification
        run: bash scripts/verify.sh
