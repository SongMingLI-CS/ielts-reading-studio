[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ielts-reading-studio"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13,<2", "pydantic>=2.7,<3", "fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1",
  "typer>=0.12", "sqlalchemy>=2.0", "openai>=1.30", "python-docx>=1.1",
  "ebooklib>=0.18", "beautifulsoup4>=4.12", "pyyaml>=6.0", "python-dotenv>=1.0",
  "python-multipart>=0.0.9", "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[project.scripts]
ielts-reading = "app.cli:main"

[tool.setuptools.packages.find]
where = [".", "components/context-novel/src"]
include = ["app*", "ielts_novel*"]

[tool.pytest.ini_options]
# Both suites run from the repository root so a single offline command covers the
# application and the bundled context-novel component.
testpaths = ["tests", "components/context-novel/tests"]

[tool.ruff]
# Syntax-level target for the whole repository; `requires-python` already pins 3.12+,
# this makes the modernisation rules (e.g. `datetime.UTC`) deterministic in CI.
target-version = "py312"

