[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ielts-reading-studio"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.7,<3", "fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1",
  "typer>=0.12", "sqlalchemy>=2.0", "openai>=1.30", "python-docx>=1.1",
  "ebooklib>=0.18", "beautifulsoup4>=4.12", "pyyaml>=6.0", "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[project.scripts]
ielts-reading = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
